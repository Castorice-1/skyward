# The Redmi K40 (alioth, also sold as the POCO F3 and the Mi 11X). Its
# recovery lives in the boot partition: the stock boot.img's ramdisk holds a
# recovery as well as the system's first-stage init, so the recovery built on
# it is flashed to boot and the phone starts into it.

[device]
codename = "alioth"
brand = "Redmi"
model = "REDMI K40"
ab = true
soc = { hans = "骁龙®870 by xn", hant = "Snapdragon® 870 by xn", en = "Snapdragon® 870 by xn" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop.
width = 1080
height = 2400
density = 440

# The backlight section this phone's earlier configuration carried is no
# longer part of the configuration: the recovery finds the panel's own
# backlight node itself. The node it named here, for a phone whose brightness
# the automatic search did not reach, is kept for when it is needed again.
# [backlight]
# path = "/sys/class/backlight/panel0-backlight/brightness"
# max_path = "/sys/class/backlight/panel0-backlight/max_brightness"

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# None to load: the FTS_TS driver this phone's kernel needs is built in and
# already reporting touches, and fts_touch_spi.ko exists in none of the
# sources, so asking for it only logs a failure on every boot.

# The files the touch layer's own init gives the system user, less those this
# phone's kernel never makes: the boot log names them one by one ("is not
# here to give to system:system"), and only these five were there, which is
# what "5 of the phone's own files" counted.
[[owners]]
user = "system"
group = "system"
mode = 0o664
paths = [
    "/dev/xiaomi-touch",
    "/sys/class/touch/touch_dev/palm_sensor",
    "/proc/tp_selftest",
    "/proc/tp_fw_version",
    "/proc/tp_lockdown_info",
]

# Each of the phone's own programs below runs as the user, in the groups
# and with the capabilities its init script on the phone gives it.

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up. It runs before the touch programs, which need none of it.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.qcom.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The touchscreen needs no program: the fts_touch_spi driver in this phone's
# kernel reports touches on its own input device, as the kernel log's
# FTS_TS lines show. The two touch binaries earlier written here are
# /vendor/bin/touch (toybox's timestamp command, which refuses to run without
# an argument) and toucheventcheck (the system's own checker, which exits 1
# in a recovery); neither makes touches work, so neither is started.

# The directories the phone's services register with. A recovery's own init
# starts neither, so they are taken from the installed system, which is at
# /mnt/system here because /system holds the recovery. hwservicemanager is a
# link to /system/system_ext/bin/hwservicemanager inside the system image, an
# address that means the running system's own root and not the image's, so the
# file is named where the image itself keeps it.
[[service]]
path = "/mnt/system/system/bin/servicemanager"
libraries = ["/mnt/system/system/lib64"]
user = "system"
groups = ["system", "readproc"]

[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The trust zone's own communication service, which the two below reach the
# secure world through.
[[service]]
path = "/vendor/bin/hw/vendor.qti.hardware.qseecom@1.0-service"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root", "drmrpc"]

# The key service of the older kind: this phone wraps its keys with
# keymaster 4.1 over HIDL, registering with the directory above rather than
# the newer one the AIDL services register with. It is what unwraps the key
# that opens /data, so the data partition stays closed without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.keymaster@4.1-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@4.1::IKeymasterDevice/default"
user = "system"
# drmrpc is the group /dev/qseecom and /dev/qsee_ipc_irq_spss are given to,
# and these QTI services reach the trust zone through them.
groups = ["system", "drmrpc"]

# The credential service, of the older kind as well: it is what checks the
# screen lock the key that opens /data is bound to.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system", "drmrpc"]

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's OS1.0.10.0,
# whose full update package on the phone maker's own download server holds
# the boot image the recovery is built on top of.
[stock]
version = "OS1.0.10.0.TKHCNXM"
package = "https://superota.d.miui.com/OS1.0.10.0.TKHCNXM/miui_ALIOTH_OS1.0.10.0.TKHCNXM_ddf5cf5ea0_13.0.zip"
recovery = "f821ba6a4b39f41e131017d6f16b1539e30839e1d188c9020b2ea43ea9e5495b"
# The partition that package keeps the recovery in. alioth has no recovery
# partition of its own, so it is the boot image's ramdisk that holds the
# recovery, and the image built on it is flashed to boot.
partition = "boot"

# The vibration motor is the aw8697 the phone's own kernel drives, but the
# recovery has yet to find the node the device tree gives its
# aw8697_vib_f0_pre in, so the motor is left alone until it does: a menu
# without a buzz beats a screen that never lights.
# [haptics]
# strength = { lightest = 0.5, strongest = 1.0 }
